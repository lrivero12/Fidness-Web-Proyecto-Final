
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo} + ' | Fidness Web'">
        Formulario de clientes
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #14213d;
            position: fixed;
            top: 0;
            left: 0;
            padding: 25px 15px;
        }

        .sidebar h3 {
            color: white;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #2563eb;
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 35px;
        }

        .page-title {
            font-weight: bold;
            color: #14213d;
        }

        .content-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 900px;
        }

        .section-title {
            color: #14213d;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .required {
            color: #dc3545;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Menú lateral -->
    <div class="sidebar">

        <h3>FIDNESS WEB</h3>

        <a th:href="@{/admin/dashboard}">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a th:href="@{/admin/clientes}" class="active">
            <i class="bi bi-people"></i>
            Clientes
        </a>

        <a th:href="@{/admin/entrenadores}">
            <i class="bi bi-person-badge"></i>
            Entrenadores
        </a>

        <a th:href="@{/admin/categorias}">
            <i class="bi bi-grid"></i>
            Categorías
        </a>

        <a th:href="@{/admin/ejercicios}">
            <i class="bi bi-activity"></i>
            Ejercicios
        </a>

        <form th:action="@{/logout}" method="post"
              class="mt-4">

            <button type="submit"
                    class="btn btn-outline-light w-100">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar sesión
            </button>
        </form>

    </div>

    <!-- Contenido principal -->
    <div class="main-content">

        <div class="mb-4">

            <h2 class="page-title" th:text="${titulo}">
                Registrar cliente
            </h2>

            <p class="text-muted">
                Completa la información personal del cliente.
            </p>

        </div>

        <div class="content-card">

            <h5 class="section-title">
                <i class="bi bi-person-vcard"></i>
                Información del cliente
            </h5>

            <!-- Formulario dinámico: registrar o editar -->
            <form method="post"
                  th:action="${idCliente != null}
                      ? @{/admin/clientes/actualizar/{id}(id=${idCliente})}
                      : @{/admin/clientes/guardar}">

                <div class="row g-3">

                    <!-- Nombre -->
                    <div class="col-md-6">

                        <label for="nombre" class="form-label">
                            Nombre <span class="required">*</span>
                        </label>

                        <input type="text"
                               class="form-control"
                               id="nombre"
                               name="nombre"
                               th:value="${usuario.nombre}"
                               maxlength="80"
                               required>
                    </div>

                    <!-- Apellidos -->
                    <div class="col-md-6">

                        <label for="apellidos" class="form-label">
                            Apellidos <span class="required">*</span>
                        </label>

                        <input type="text"
                               class="form-control"
                               id="apellidos"
                               name="apellidos"
                               th:value="${usuario.apellidos}"
                               maxlength="100"
                               required>
                    </div>

                    <!-- Correo -->
                    <div class="col-md-6">

                        <label for="correo" class="form-label">
                            Correo electrónico
                            <span class="required">*</span>
                        </label>

                        <input type="email"
                               class="form-control"
                               id="correo"
                               name="correo"
                               th:value="${usuario.correo}"
                               maxlength="150"
                               required>
                    </div>

                    <!-- Teléfono -->
                    <div class="col-md-6">

                        <label for="telefono" class="form-label">
                            Teléfono
                        </label>

                        <input type="tel"
                               class="form-control"
                               id="telefono"
                               name="telefono"
                               th:value="${usuario.telefono}"
                               maxlength="20">
                    </div>

                    <!-- Fecha de nacimiento -->
                    <div class="col-md-6">

                        <label for="fechaNacimiento"
                               class="form-label">
                            Fecha de nacimiento
                        </label>

                        <input type="date"
                               class="form-control"
                               id="fechaNacimiento"
                               name="fechaNacimiento"
                               th:value="${usuario.fechaNacimiento}"
                               th:attr="max=${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}">
                    </div>

                    <!-- Contraseña: solamente para registro -->
                    <div class="col-md-6"
                         th:if="${idCliente == null}">

                        <label for="contrasena" class="form-label">
                            Contraseña
                            <span class="required">*</span>
                        </label>

                        <input type="password"
                               class="form-control"
                               id="contrasena"
                               name="contrasena"
                               minlength="8"
                               maxlength="72"
                               autocomplete="new-password"
                               required>

                        <div class="form-text">
                            Utiliza al menos 8 caracteres.
                        </div>
                    </div>

                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/admin/clientes}"
                       class="btn btn-outline-secondary">

                        <i class="bi bi-arrow-left"></i>
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-save"></i>

                        <span th:text="${idCliente != null}
                            ? 'Guardar cambios'
                            : 'Registrar cliente'">
                            Registrar cliente
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
