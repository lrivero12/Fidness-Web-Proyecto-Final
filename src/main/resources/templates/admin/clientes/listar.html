
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gestión de clientes | Fidness Web</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #14213d;
            position: fixed;
            top: 0;
            left: 0;
            padding: 25px 15px;
        }

        .sidebar h3 {
            color: white;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #2563eb;
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 35px;
        }

        .page-title {
            font-weight: bold;
            color: #14213d;
        }

        .content-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .table thead {
            background-color: #f1f5f9;
        }

        .table th {
            color: #334155;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Menú lateral -->
    <div class="sidebar">

        <h3>FIDNESS WEB</h3>

        <a th:href="@{/admin/dashboard}">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a th:href="@{/admin/clientes}" class="active">
            <i class="bi bi-people"></i>
            Clientes
        </a>

        <a th:href="@{/admin/entrenadores}">
            <i class="bi bi-person-badge"></i>
            Entrenadores
        </a>

        <a th:href="@{/admin/categorias}">
            <i class="bi bi-grid"></i>
            Categorías
        </a>

        <a th:href="@{/admin/ejercicios}">
            <i class="bi bi-activity"></i>
            Ejercicios
        </a>

        <form th:action="@{/logout}" method="post"
              class="mt-4">

            <button type="submit"
                    class="btn btn-outline-light w-100">
                <i class="bi bi-box-arrow-right"></i>
                Cerrar sesión
            </button>
        </form>

    </div>

    <!-- Contenido principal -->
    <div class="main-content">

        <div class="d-flex justify-content-between
                    align-items-center flex-wrap gap-3 mb-4">

            <div>
                <h2 class="page-title">
                    Gestión de clientes
                </h2>

                <p class="text-muted mb-0">
                    Administración de clientes registrados
                    en Fidness Web.
                </p>
            </div>

            <a th:href="@{/admin/clientes/nuevo}"
               class="btn btn-primary">

                <i class="bi bi-person-plus"></i>
                Registrar cliente
            </a>

        </div>

        <!-- Mensajes de confirmación -->
        <div th:if="${mensaje}"
             class="alert alert-success"
             role="alert">

            <i class="bi bi-check-circle"></i>
            <span th:text="${mensaje}"></span>
        </div>

        <!-- Mensajes de error -->
        <div th:if="${mensajeError}"
             class="alert alert-danger"
             role="alert">

            <i class="bi bi-exclamation-triangle"></i>
            <span th:text="${mensajeError}"></span>
        </div>

        <div class="content-card">

            <h5 class="mb-4">
                <i class="bi bi-people-fill"></i>
                Listado de clientes
            </h5>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre completo</th>
                            <th>Correo electrónico</th>
                            <th>Teléfono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="cliente : ${clientes}">

                            <td th:text="${cliente.idCliente}">
                            </td>

                            <td th:text="${cliente.usuario.nombre + ' ' + cliente.usuario.apellidos}">
                            </td>

                            <td th:text="${cliente.usuario.correo}">
                            </td>

                            <td th:text="${cliente.usuario.telefono != null && !cliente.usuario.telefono.isEmpty() ? cliente.usuario.telefono : 'No registrado'}">
                            </td>

                            <td>
                                <span th:if="${cliente.usuario.estado}"
                                      class="badge bg-success">
                                    Activo
                                </span>

                                <span th:unless="${cliente.usuario.estado}"
                                      class="badge bg-secondary">
                                    Inactivo
                                </span>
                            </td>

                            <td>

                                <div class="d-flex gap-2">

                                    <a th:href="@{/admin/clientes/editar/{id}(id=${cliente.idCliente})}"
                                       class="btn btn-sm btn-outline-primary">

                                        <i class="bi bi-pencil-square"></i>
                                        Editar
                                    </a>

                                    <form th:action="@{/admin/clientes/estado/{id}(id=${cliente.idCliente})}"
                                          method="post">

                                        <button type="submit"
                                                class="btn btn-sm"
                                                th:classappend="${cliente.usuario.estado} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                th:text="${cliente.usuario.estado} ? 'Desactivar' : 'Activar'"
                                                onclick="return confirm('¿Deseas cambiar el estado de este cliente?');">
                                        </button>

                                    </form>

                                </div>

                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(clientes)}">

                            <td colspan="6"
                                class="text-center text-muted py-4">

                                <i class="bi bi-info-circle"></i>
                                No hay clientes registrados.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</body>
</html>
