
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formulario de categoría | Fidness Web</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 25px 15px;
            background: #172b4d;
            color: white;
        }

        .sidebar-brand {
            font-size: 25px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar-brand span {
            color: #60a5fa;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            padding: 13px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            text-decoration: none;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2563eb;
            color: white;
        }

        .sidebar form {
            margin-top: 30px;
        }

        .logout-btn {
            background: transparent;
            border: none;
            color: #fca5a5;
            padding: 13px 16px;
            width: 100%;
            text-align: left;
        }

        .main-content {
            margin-left: 250px;
            padding: 35px;
        }

        .form-card {
            max-width: 850px;
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.05);
        }

        .page-title {
            font-weight: bold;
            color: #172b4d;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .btn-primary {
            background: #2563eb;
            border-color: #2563eb;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<aside class="sidebar">

    <div class="sidebar-brand">
        FIDNESS <span>WEB</span>
    </div>

    <a th:href="@{/admin/dashboard}">
        Dashboard
    </a>

    <a th:href="@{/admin/clientes}">
        Gestión de clientes
    </a>

    <a th:href="@{/admin/entrenadores}">
        Gestión de entrenadores
    </a>

    <a th:href="@{/admin/ejercicios}">
        Gestión de ejercicios
    </a>

    <a th:href="@{/admin/categorias}" class="active">
        Gestión de categorías
    </a>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="logout-btn">
            Cerrar sesión
        </button>
    </form>

</aside>

<main class="main-content">

    <div class="mb-4">

        <h2 class="page-title" th:text="${titulo}">
            Nueva categoría
        </h2>

        <p class="text-secondary">
            Completa la información de la categoría
            de ejercicios.
        </p>

    </div>

    <div class="form-card">

        <form th:action="@{/admin/categorias/guardar}"
              th:object="${categoria}"
              method="post"
              novalidate>

            <input type="hidden"
                   th:field="*{idCategoria}">

            <input type="hidden"
                   th:field="*{estado}">

            <!-- NOMBRE -->
            <div class="mb-4">

                <label for="nombre" class="form-label">
                    Nombre de la categoría
                </label>

                <input type="text"
                       id="nombre"
                       th:field="*{nombre}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('nombre')}
                           ? 'is-invalid' : ''"
                       maxlength="80"
                       placeholder="Ejemplo: Hombros">

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('nombre')}"
                     th:errors="*{nombre}">
                    Error en el nombre.
                </div>

            </div>

            <!-- DESCRIPCIÓN -->
            <div class="mb-4">

                <label for="descripcion" class="form-label">
                    Descripción
                </label>

                <textarea id="descripcion"
                          th:field="*{descripcion}"
                          class="form-control"
                          th:classappend="${#fields.hasErrors('descripcion')}
                              ? 'is-invalid' : ''"
                          rows="4"
                          maxlength="255"
                          placeholder="Describe la categoría"></textarea>

                <div class="invalid-feedback"
                     th:if="${#fields.hasErrors('descripcion')}"
                     th:errors="*{descripcion}">
                    Error en la descripción.
                </div>

            </div>

            <div class="row">

                <!-- SERIES -->
                <div class="col-md-6 mb-4">

                    <label for="seriesRecomendadas"
                           class="form-label">
                        Series recomendadas
                    </label>

                    <input type="number"
                           id="seriesRecomendadas"
                           th:field="*{seriesRecomendadas}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('seriesRecomendadas')}
                               ? 'is-invalid' : ''"
                           min="1"
                           max="20">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('seriesRecomendadas')}"
                         th:errors="*{seriesRecomendadas}">
                        Error en las series.
                    </div>

                </div>

                <!-- REPETICIONES -->
                <div class="col-md-6 mb-4">

                    <label for="repeticionesRecomendadas"
                           class="form-label">
                        Repeticiones recomendadas
                    </label>

                    <input type="text"
                           id="repeticionesRecomendadas"
                           th:field="*{repeticionesRecomendadas}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('repeticionesRecomendadas')}
                               ? 'is-invalid' : ''"
                           maxlength="30"
                           placeholder="Ejemplo: 10-12">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('repeticionesRecomendadas')}"
                         th:errors="*{repeticionesRecomendadas}">
                        Error en las repeticiones.
                    </div>

                </div>

            </div>

            <!-- BOTONES -->
            <div class="d-flex justify-content-end gap-3">

                <a th:href="@{/admin/categorias}"
                   class="btn btn-outline-secondary px-4">
                    Cancelar
                </a>

                <button type="submit"
                        class="btn btn-primary px-4">
                    Guardar categoría
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
