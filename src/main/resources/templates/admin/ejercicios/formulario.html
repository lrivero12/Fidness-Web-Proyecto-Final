
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Formulario de ejercicios | Fidness Web</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f3f6fb;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .sidebar {
            width: 200px;
            min-height: 100vh;
            background: #192e52;
            position: fixed;
            top: 0;
            left: 0;
            padding: 22px 10px;
        }

        .brand {
            color: white;
            font-size: 20px;
            font-weight: bold;
            margin: 5px 15px 28px;
        }

        .brand span {
            color: #60a5fa;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 14px;
            border-radius: 7px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background: #2860ed;
        }

        .sidebar .logout {
            color: #ff7777;
            margin-top: 25px;
        }

        .main-content {
            margin-left: 200px;
            padding: 30px 28px;
        }

        h2 {
            color: #142c50;
            font-weight: bold;
        }

        .subtitle {
            color: #607797;
            font-size: 14px;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 850px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.04);
        }

        .form-label {
            font-weight: 600;
            color: #142c50;
            font-size: 14px;
        }

        .form-control,
        .form-select {
            border-radius: 6px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
                padding: 20px 12px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <div class="brand">
            FIDNESS <span>WEB</span>
        </div>

        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/clientes}">Gestión de clientes</a>
        <a th:href="@{/admin/entrenadores}">Gestión de entrenadores</a>

        <a th:href="@{/admin/ejercicios}" class="active">
            Gestión de ejercicios
        </a>

        <a th:href="@{/admin/categorias}">Gestión de categorías</a>

        <form th:action="@{/logout}" method="post">
            <button type="submit"
                    class="btn btn-link logout text-decoration-none">
                Cerrar sesión
            </button>
        </form>
    </aside>

    <main class="main-content">

        <h2 th:text="${titulo}">Nuevo ejercicio</h2>

        <p class="subtitle mb-4">
            Completa la información del ejercicio.
        </p>

        <div class="form-card">

            <form th:action="@{/admin/ejercicios/guardar}"
                  th:object="${ejercicio}"
                  method="post">

                <input type="hidden" th:field="*{idEjercicio}">

                <div class="mb-3">
                    <label class="form-label">
                        Nombre del ejercicio
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{nombre}"
                           placeholder="Ejemplo: Press militar"
                           maxlength="100"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Descripción
                    </label>

                    <textarea class="form-control"
                              th:field="*{descripcion}"
                              rows="3"
                              placeholder="Describe el ejercicio"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        Instrucciones
                    </label>

                    <textarea class="form-control"
                              th:field="*{instrucciones}"
                              rows="4"
                              placeholder="Explica cómo realizar el ejercicio"></textarea>
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Categoría
                        </label>

                        <select class="form-select"
                                th:field="*{categoria.idCategoria}"
                                required>

                            <option value="">
                                Selecciona una categoría
                            </option>

                            <option th:each="categoria : ${categorias}"
                                    th:value="${categoria.idCategoria}"
                                    th:text="${categoria.nombre}">
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Nivel de dificultad
                        </label>

                        <select class="form-select"
                                th:field="*{nivel}"
                                required>

                            <option value="">
                                Selecciona un nivel
                            </option>

                            <option value="Principiante">
                                Principiante
                            </option>

                            <option value="Intermedio">
                                Intermedio
                            </option>

                            <option value="Avanzado">
                                Avanzado
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        Imagen del ejercicio
                    </label>

                    <input type="text"
                           class="form-control"
                           th:field="*{imagen}"
                           placeholder="Ejemplo: press_militar.jpg">

                    <small class="text-muted">
                        Por ahora, ingresa el nombre del archivo de imagen.
                    </small>
                </div>

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/admin/ejercicios}"
                       class="btn btn-outline-secondary px-4">
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-primary px-4">
                        Guardar ejercicio
                    </button>

                </div>

            </form>
        </div>
    </main>

</body>
</html>
