
# Nombre del proyecto
spring.application.name=FidnessWeb

# Puerto del servidor
server.port=8081

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fidness_web
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de Thymeleaf
spring.thymeleaf.cache=false

# Evitar consultas durante la renderizacion de vistas
spring.jpa.open-in-view=false
