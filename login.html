
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Fidness Web</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f3f6fb;
            font-family: Arial, sans-serif;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .brand {
            color: #2563eb;
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .subtitle {
            color: #64748b;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-control {
            padding: 12px;
            border-radius: 8px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem
                        rgba(37, 99, 235, 0.15);
        }

        .btn-login {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn-login:hover {
            background: #1d4ed8;
            color: white;
        }

        .register-link {
            color: #2563eb;
            font-weight: 500;
            text-decoration: none;
        }

        .register-link:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

        .alert {
            border-radius: 8px;
            font-size: 14px;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- ENCABEZADO -->

        <div class="brand">
            FIDNESS WEB
        </div>

        <p class="subtitle">
            Bienvenido a tu espacio de entrenamiento
        </p>

        <h4 class="text-center mb-4">
            Iniciar sesión
        </h4>

        <!-- ===================================== -->
        <!-- MENSAJE DE REGISTRO EXITOSO -->
        <!-- ===================================== -->

        <div th:if="${mensaje}"
             class="alert alert-success"
             role="alert"
             th:text="${mensaje}">
        </div>

        <!-- ===================================== -->
        <!-- MENSAJE DE ERROR DE AUTENTICACIÓN -->
        <!-- ===================================== -->

        <div th:if="${param.error}"
             class="alert alert-danger"
             role="alert">

            Correo o contraseña incorrectos,
            o cuenta deshabilitada.

        </div>

        <!-- ===================================== -->
        <!-- MENSAJE DE CIERRE DE SESIÓN -->
        <!-- ===================================== -->

        <div th:if="${param.logout}"
             class="alert alert-success"
             role="alert">

            Has cerrado sesión correctamente.

        </div>

        <!-- ===================================== -->
        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <!-- ===================================== -->

        <form th:action="@{/login}" method="post">

            <!-- CORREO ELECTRÓNICO -->

            <div class="mb-3">

                <label for="correo"
                       class="form-label">
                    Correo electrónico
                </label>

                <input type="email"
                       class="form-control"
                       id="correo"
                       name="correo"
                       placeholder="ejemplo@correo.com"
                       autocomplete="username"
                       required>

            </div>

            <!-- CONTRASEÑA -->

            <div class="mb-3">

                <label for="contrasena"
                       class="form-label">
                    Contraseña
                </label>

                <input type="password"
                       class="form-control"
                       id="contrasena"
                       name="contrasena"
                       placeholder="Ingresa tu contraseña"
                       autocomplete="current-password"
                       required>

            </div>

            <!-- PROTECCIÓN CSRF -->

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <!-- BOTÓN INICIAR SESIÓN -->

            <button type="submit"
                    class="btn btn-login w-100">

                Iniciar sesión

            </button>

        </form>

        <!-- ===================================== -->
        <!-- ENLACE PARA REGISTRAR NUEVA CUENTA -->
        <!-- ===================================== -->

        <p class="text-center mt-4 mb-0">

            ¿No tienes una cuenta?

            <a th:href="@{/registro}"
               class="register-link">

                Regístrate aquí

            </a>

        </p>

        <!-- PIE DE PÁGINA -->

        <div class="footer-text">
            © 2026 Fidness Web
        </div>

    </div>

</div>

</body>
</html>
