
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${titulo} + ' | Fidness Web'">
        Formulario de entrenador | Fidness Web
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f6fb;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: #14213d;
            position: fixed;
            top: 0;
            left: 0;
            padding: 25px 15px;
        }

        .sidebar h3 {
            color: white;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .sidebar a {
            display: block;
            color: #cbd5e1;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #2563eb;
            color: white;
        }

        .main-content {
            margin-left: 250px;
            padding: 35px;
        }

        .page-title {
            font-weight: bold;
            color: #14213d;
        }

        .content-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 900px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .section-title {
            color: #14213d;
            font-weight: 600;
        }

        .form-label {
            font-weight: 600;
            color: #334155;
        }

        .required {
            color: #dc3545;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                width: 100%;
                min-height: auto;
            }

            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- MENÚ LATERAL -->
    <div class="sidebar">

        <h3>FIDNESS WEB</h3>

        <a th:href="@{/admin/dashboard}">
            <i class="bi bi-speedometer2"></i>
            Dashboard
        </a>

        <a th:href="@{/admin/clientes}">
            <i class="bi bi-people"></i>
            Clientes
        </a>

        <a th:href="@{/admin/entrenadores}" class="active">
            <i class="bi bi-person-badge"></i>
            Entrenadores
        </a>

        <a th:href="@{/admin/categorias}">
            <i class="bi bi-grid"></i>
            Categorías
        </a>

        <a th:href="@{/admin/ejercicios}">
            <i class="bi bi-activity"></i>
            Ejercicios
        </a>

        <form th:action="@{/logout}"
              method="post"
              class="mt-4">

            <button type="submit"
                    class="btn btn-outline-light w-100">

                <i class="bi bi-box-arrow-right"></i>
                Cerrar sesión
            </button>

        </form>

    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-content">

        <div class="mb-4">

            <h2 class="page-title" th:text="${titulo}">
                Registrar entrenador
            </h2>

            <p class="text-muted">
                Completa la información personal del entrenador.
            </p>

        </div>

        <div class="content-card">

            <h5 class="section-title mb-4">
                <i class="bi bi-person-vcard"></i>
                Información del entrenador
            </h5>

            <!-- Formulario de registro o edición -->
            <form method="post"
                  th:action="${idEntrenador != null}
                      ? @{/admin/entrenadores/actualizar/{id}(id=${idEntrenador})}
                      : @{/admin/entrenadores/guardar}">

                <div class="row g-3">

                    <!-- Nombre -->
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">
                            Nombre <span class="required">*</span>
                        </label>

                        <input type="text"
                               id="nombre"
                               name="nombre"
                               class="form-control"
                               th:value="${usuario.nombre}"
                               maxlength="80"
                               required>
                    </div>

                    <!-- Apellidos -->
                    <div class="col-md-6">
                        <label for="apellidos" class="form-label">
                            Apellidos <span class="required">*</span>
                        </label>

                        <input type="text"
                               id="apellidos"
                               name="apellidos"
                               class="form-control"
                               th:value="${usuario.apellidos}"
                               maxlength="100"
                               required>
                    </div>

                    <!-- Correo -->
                    <div class="col-md-6">
                        <label for="correo" class="form-label">
                            Correo electrónico
                            <span class="required">*</span>
                        </label>

                        <input type="email"
                               id="correo"
                               name="correo"
                               class="form-control"
                               th:value="${usuario.correo}"
                               maxlength="150"
                               required>
                    </div>

                    <!-- Teléfono -->
                    <div class="col-md-6">
                        <label for="telefono" class="form-label">
                            Teléfono
                        </label>

                        <input type="tel"
                               id="telefono"
                               name="telefono"
                               class="form-control"
                               th:value="${usuario.telefono}"
                               maxlength="20">
                    </div>

                    <!-- Fecha de nacimiento -->
                    <div class="col-md-6">
                        <label for="fechaNacimiento"
                               class="form-label">
                            Fecha de nacimiento
                        </label>

                        <input type="date"
                               id="fechaNacimiento"
                               name="fechaNacimiento"
                               class="form-control"
                               th:value="${usuario.fechaNacimiento}">
                    </div>

                    <!-- Contraseña: solo registro -->
                    <div class="col-md-6"
                         th:if="${idEntrenador == null}">

                        <label for="contrasena"
                               class="form-label">
                            Contraseña
                            <span class="required">*</span>
                        </label>

                        <input type="password"
                               id="contrasena"
                               name="contrasena"
                               class="form-control"
                               minlength="8"
                               autocomplete="new-password"
                               required>

                        <div class="form-text">
                            Utiliza al menos 8 caracteres.
                        </div>
                    </div>

                </div>

                <div class="alert alert-info mt-4"
                     th:if="${idEntrenador != null}">

                    <i class="bi bi-info-circle"></i>
                    La contraseña y el rol del entrenador
                    no se modificarán al guardar los cambios.

                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">

                    <a th:href="@{/admin/entrenadores}"
                       class="btn btn-outline-secondary">

                        <i class="bi bi-arrow-left"></i>
                        Cancelar
                    </a>

                    <button type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-save"></i>

                        <span th:text="${idEntrenador != null}
                              ? 'Guardar cambios'
                              : 'Registrar entrenador'">
                            Registrar entrenador
                        </span>

                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
